name: Build RECALL Native APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --org de.recalldevelopment --project-name recall_native .
          flutter pub get

      - name: Paketname setzen
        run: |
          sed -i 's/com.example.recall_native/de.recalldevelopment.recall_native/g' android/app/build.gradle.kts || true
          sed -i 's/com.example.recall_native/de.recalldevelopment.recall_native/g' android/app/build.gradle || true

      - name: APK bauen
        run: flutter build apk --debug

      - name: RECALL APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: RECALL-Native-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
