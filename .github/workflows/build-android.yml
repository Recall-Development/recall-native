name: Build RECALL Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --org de.recalldevelopment --project-name recall_native .

      - name: RECALL Quellcode entpacken
        run: |
          rm -rf lib
          mkdir -p lib
          unzip -o lib.zip -d lib_source

          if [ -f "lib_source/lib/main.dart" ]; then
            cp -R lib_source/lib/* lib/
          else
            cp -R lib_source/* lib/
          fi

          echo "RECALL-Dateien:"
          find lib -maxdepth 3 -type f

          test -f lib/main.dart

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: Release APK bauen
        run: flutter build apk --release

      - name: RECALL Release APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: RECALL-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
