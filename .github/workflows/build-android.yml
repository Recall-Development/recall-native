name: MEMVEXA Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'memvexa_project_v1.0.1.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build signed MEMVEXA APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create clean Flutter project
        run: |
          rm -rf build android lib pubspec.yaml scripts memvexa.png
          flutter create --platforms=android --org de.recalldevelopment --project-name memvexa .

      - name: Restore MEMVEXA sources
        run: |
          unzip -oq memvexa_project_v1.0.1.zip
          test -f lib/main.dart
          test -f scripts/prepare_android.py
          test -f memvexa.png

      - name: Prepare Android + widget
        run: python3 scripts/prepare_android.py
      - name: Fix Flutter 3.44 AGP 9 compatibility
        run: |
          sed -i '/id("kotlin-android")/d' android/app/build.gradle.kts
          sed -i '/kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }/d' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts <<'EOF'

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }
          EOF

      - name: Create launcher icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          convert memvexa.png -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert memvexa.png -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert memvexa.png -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert memvexa.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert memvexa.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Restore permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MEMVEXA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEMVEXA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing MEMVEXA_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing MEMVEXA_KEYSTORE_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/memvexa-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=memvexa
          storeFile=memvexa-release.jks
          EOF

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build signed universal APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=1

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release --build-name=1.0.0 --build-number=1

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload install APK
        uses: actions/upload-artifact@v4
        with:
          name: MEMVEXA-INSTALL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: MEMVEXA-PLAYSTORE-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
